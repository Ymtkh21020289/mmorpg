<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>MMORPG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; }
        canvas { display: block; margin: 0 auto; }
        #game-tooltip {
            position: absolute;
            display: none; /* 最初は非表示 */
            background-color: rgba(0, 0, 0, 0.85); /* 半透明の黒背景 */
            border: 2px solid #fff;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-family: 'DotGothic16', sans-serif;
            font-size: 16px; 
            line-height: 1.8;
            pointer-events: none; /* マウス入力を透過させる（重要） */
            z-index: 1000; /* ゲーム画面より手前に */
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            min-width: 200px;
        }

        /* アイテム名のスタイル */
        .tooltip-title {
            font-size: 18px;
            font-weight: nomal;
            margin-bottom: 8px;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
        }

        /* ★重要: 虹色に光る文字のエフェクト */
        .rainbow-text {
            background: linear-gradient(
                to right, 
                #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent; /* 文字色を透明にして背景のグラデーションを見せる */
            animation: rainbow-anim 3s linear infinite;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255,255,255,0.2); /* ほんのり発光 */
        }

        /* グラデーションを動かすアニメーション */
        @keyframes rainbow-anim {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; background-size: 200%; }
        }

        /* ランクごとの色（必要に応じて） */
        .rank-C { color: #fff; }
        .rank-B { color: #00ff00; }
        .rank-A { color: #0088ff; }
        .rank-S { color: #ff0000; } /* Sランクのベース色 */

        #system-log {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: min(360px, calc(100vw - 40px));
            max-height: 220px;
            overflow-y: auto;
            box-sizing: border-box;
            padding: 10px 12px;
            color: #fff;
            background: rgba(0, 0, 0, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 6px;
            font-family: 'DotGothic16', sans-serif;
            font-size: 14px;
            line-height: 1.5;
            pointer-events: none;
            z-index: 1000;
        }

        #system-log-title {
            margin-bottom: 6px;
            color: #ffd54a;
            font-size: 13px;
        }

        .system-log-entry + .system-log-entry {
            margin-top: 4px;
        }

        #skill-tree-overlay { position: fixed; inset: 0; display: none; z-index: 3000; background: rgba(0,0,0,.88); color: #fff; font-family: 'DotGothic16', sans-serif; }
        #skill-tree-overlay.open { display: flex; flex-direction: column; }
        .skill-tree-header { padding: 14px 20px; display:flex; gap:20px; align-items:center; border-bottom:1px solid #aaa; }
        #skill-tree-close { margin-left:auto; padding:8px 14px; cursor:pointer; }
        #skill-tree-grid { overflow:auto; display:grid; grid-template-columns:repeat(11, 58px); grid-template-rows:repeat(50, 58px); padding:24px; justify-content:center; }
        .skill-node { width:50px; height:50px; box-sizing:border-box; border:2px solid #444; background:#20242d; font-size:10px; display:flex; text-align:center; align-items:center; justify-content:center; padding:3px; cursor:default; white-space:pre-wrap; }
        .skill-node.path { background:#57606a; border-color:#8a939f; }
        .skill-node.start { background:#159957; border-color:#b7f7c9; }
        .skill-node.available { background:#8a6500; border-color:#ffe26a; cursor:pointer; }
        .skill-node.taken { background:#1264a3; border-color:#72c5ff; }
        .skill-node.locked { opacity:.4; }
        #skill-tree-details { position:fixed; right:22px; bottom:22px; width:310px; min-height:100px; padding:14px; background:#111; border:1px solid #aaa; white-space:pre-line; }
        .skill-hotbar { position:fixed; right:20px; bottom:20px; z-index:110; display:flex; gap:7px; }
        .skill-hotbar button { font-family:'DotGothic16',sans-serif; color:#fff; background:#263238; border:1px solid #7dd3fc; padding:7px; cursor:pointer; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    <aside id="system-log" aria-live="polite" aria-label="システムログ">
        <div id="system-log-title">SYSTEM LOG</div>
        <div id="system-log-entries"></div>
    </aside>
    <input type="text" id="chatInput" placeholder="Enterでチャット..." 
           style="position: absolute; bottom: 20px; left: 20px; width: 300px; padding: 10px; display: none;">
    <script src="data/maps.js"></script>
    <script src="data/items.js"></script>
    <script src="game.js"></script>
</body>
</html>
